spring:
  application:
    name: uniro-backend

  datasource:
    url: jdbc:mysql://localhost:3307/uniro_db
    username: uniro
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
    connection-timeout: 5000
    timeout: 5000
    write-timeout: 5000

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

aws:
  s3:
    region: ${AWS_REGION:ap-southeast-2}
    bucket: ${AWS_S3_BUCKET}

verification:
  enrollment:
    allowed-university-ids: ${ENROLLMENT_UNIVERSITY_IDS}

guardian:
  consent:
    base-url: ${GUARDIAN_CONSENT_BASE_URL:http://localhost:8080/guardian-consents}

nts:
  business:
    base-url: https://api.odcloud.kr/api/nts-businessman/v1
    service-key: ${NTS_API_SERVICE_KEY}

ai:
  gemini:
    # 키가 없으면 AI 코스 초안은 502, 리뷰 AI 요약은 건너뛴다 (키는 .env나 실행 설정의 환경변수로만 넣는다)
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
    base-url: https://generativelanguage.googleapis.com/v1beta
    timeout-seconds: 15
