spring:
  application:
    name: uniro-backend

  datasource:
    url: jdbc:mysql://localhost:3307/uniro_db
    username: uniro
    password: ${MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000

aws:
  s3:
    region: ${AWS_REGION:ap-southeast-2}
    bucket: ${AWS_S3_BUCKET}

verification:
  enrollment:
    allowed-university-ids: ${ENROLLMENT_UNIVERSITY_IDS}