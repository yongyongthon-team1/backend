services:
  mysql:
    image: mysql:8.0
    container_name: uniro-mysql
    restart: unless-stopped

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: uniro_db
      MYSQL_USER: uniro
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    ports:
      - "3307:3306"

    volumes:
      - uniro_mysql_data:/var/lib/mysql

volumes:
  uniro_mysql_data: